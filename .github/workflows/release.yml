name: Release

# A tag vX.Y.Z on main releases version X.Y.Z: on PyPI with trusted publishing, which needs no
# stored token, and as a GitHub release with the notes of CHANGELOG.md. CONTRIBUTING.md has the
# steps.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and check
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, to check that the tag is on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check that the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Build the sdist and the wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Check that the tag names the version of the package
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/banksman-${version}.tar.gz"
          test -f "dist/banksman-${version}-py3-none-any.whl"
          test "$(find dist -type f | wc -l)" -eq 2

      - name: Check that the wheel carries no tests
        run: |
          if python -m zipfile -l dist/*.whl | grep -E '(^|/)tests/'; then
            echo "The wheel carries tests." >&2
            exit 1
          fi

      - name: Take the notes of the version from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[.*\]: /) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section ## [${version}]." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  pypi:
    name: Publish on PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/banksman/
    permissions:
      # Trusted publishing: PyPI accepts the OIDC token of this job instead of a stored token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create the GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "banksman ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
